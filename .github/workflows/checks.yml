# The data and code checks, on every push and pull request, so a broken quote or a failing test shows up here
# and not only on one laptop.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Records and pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      # Every cited line exists and every quoted phrase is really in its lines.
      - run: python scripts/check_ledger.py data/seeds/ledger.yaml data/seeds/ledger_heldout.yaml data/seeds/ledger_ext.yaml data/seeds/ledger_material.yaml data/seeds/ledger_coverage.yaml
      - run: python -m pytest -q tests

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
      # Opens every page in a real browser and clicks a graph filter.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
