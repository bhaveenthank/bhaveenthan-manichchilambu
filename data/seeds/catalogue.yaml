- {id: kanakan, cat: PERSON, sub: historical, ta: கனகன், forms: [கனகனும்], search: [Kanakan], line: SIL-26-0159, status: text, note: "Named separately from Visayan here, so they can be two people. Elsewhere கனக விசயர் is a pair, SIL-26-0186."}
