# The extraction catalogue: 24 categories, and the items in them that weren't in the graph yet.
#
# Every item cites one line where its Tamil form really occurs. scripts/check_catalogue.py fails if it doesn't.
# `forms` are spellings to look for in the verse. `search` holds modern and transliterated forms that people type;
# they help the search and are never claimed to be in the text.
# `node` points at an existing graph node when there is one. `status`: text (the line says it), title (only in a canto
# title), reading (my interpretation, see note). Everything here is a draft until a Tamil scholar reads it.

taxonomy:
  # store: entity = a node; record = a ledger record of its own; relation = an edge family; provenance = evidence fields.
  # module: where it lives in ontology/modules.
  - {id: PERSON, store: entity, module: m03_agents, sub: [main, secondary, cameo, historical, unnamed]}
  - {id: DEITY, store: entity, module: m03_agents, sub: [god, goddess, guardian, celestial, speaking_image]}
  - {id: GROUP, store: entity, module: m03_agents, sub: [merchants, artisans, performers, religious, guards, community]}
  - {id: KINSHIP, store: relation, module: m15_social, sub: [parent, child, spouse, companion, teacher, ruler, servant]}
  - {id: PLACE, store: entity, module: m09_place, sub: [country, city, quarter, village, port, mountain, river, pond, island]}
  - {id: BUILDING, store: entity, module: m09_place, sub: [palace, temple, monastery, market, prison, charity_hall, assembly]}
  - {id: OBJECT, store: entity, module: m04_objects, sub: [vessel, tool, instrument, weapon, furniture, ceremonial]}
  - {id: JEWEL, store: entity, module: m04_objects, sub: [foot, arm, hand, finger, neck, ear, head, gem]}
  - {id: FOOD, store: entity, module: m04_objects, sub: [cooked, fruit, vegetable, grain, dairy, meat, drink]}
  - {id: PLANT_ANIMAL, store: entity, module: m04_objects, sub: [tree, flower, plant_part, domestic_animal, wild_animal, bird]}
  - {id: MATERIAL, store: entity, module: m04_objects, sub: [metal, pearl, gem, textile, perfume, salt, merchandise]}
  - {id: OCCUPATION, store: entity, module: m15_social, sub: [metal, wood, cloth, food, sea, performance, learned]}
  - {id: EVENT, store: record, module: m05_events, sub: [give, sell, travel, accuse, teach, judge, fight, marry, die]}
  - {id: STATE, store: record, module: m07_states, sub: [hunger, illness, grief, wealth, ownership, captivity]}
  - {id: CLAIM, store: record, module: m10_speech, sub: [accusation, testimony, warning, promise, denial, question, order]}
  - {id: BELIEF, store: record, module: m11_belief, sub: [belief, mistaken_identity, doubt, discovery]}
  - {id: INTENTION, store: record, module: m13_plans, sub: [plan, desire, goal, decision]}
  - {id: TIME, store: relation, module: m08_time, sub: [before_after, duration, embedded_past, reported, foretold]}
  - {id: CAUSE, store: relation, module: m14_causes, sub: [causes, enables, prevents, responds_to]}
  - {id: FESTIVAL_ART, store: entity, module: m05_events, sub: [festival, ceremony, dance, music, worship]}
  - {id: RELIGION, store: record, module: m18_interpretation, sub: [school, doctrine, vow, principle, debate]}
  - {id: COSMOLOGY, store: record, module: m17_cosmology, sub: [curse, boon, miracle, rebirth, karma, prophecy]}
  - {id: CROSS_TEXT, store: relation, module: m19_crosstext, sub: [retelling, shared_incident, memory, conflicting_account]}
  - {id: EVIDENCE, store: provenance, module: m20_provenance, sub: [edition, canto, line, span, narrator, commentary]}

