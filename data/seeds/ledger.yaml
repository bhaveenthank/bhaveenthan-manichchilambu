# The hand-drafted ledger. One record = one thing somebody in the text tells us.
#
#   voice : who is telling it, outermost first. [poet] is the narrator. [poet, goldsmith] means
#           the poet tells us the goldsmith said it.
#   mood  : asserted | negated | claimed | thought | command | conditional | intended |
#           predicted | wish | metaphor | address | dreamed | question
#           A speaker the text doesn't name goes in the voice chain as `unknown`.
#   retells: this record is another telling of that one. Not a cause, not an identity.
#   after_death: the text really does have this person act after dying. Stops the check from objecting.
#   life  : main, or the name of the earlier birth this belongs to
#   t     : story time, NOT canto number. Anything told as a flashback gets an earlier t than the moment
#           it is told (Aputhiran's story is told in canto 14 but happens long before canto 11).
#           Earlier births use negative numbers. Reading order comes from the line ids.
#   does  : state changes: +holds(a,b) starts something, -holds(a,b) ends it
#   check : a phrase that must appear in the cited lines. A script enforces this.
#   ep    : episode. dev episodes were encoded first, then the format was frozen before held-out ones.

