# Links between the epics, sorted by what kind of link they are. Mixing these up is the classic mistake:
#   identity     : the same individual in both poems
#   continuation : one poem carries on a thread of the other
#   motif        : a recurring institution or thing, where each occurrence stays its own
#   comparable   : two separate events shaped alike. Nothing passes between them.
# `not_this` says what the link doesn't let you conclude.
- {id: b_family, cls: continuation, en: "Kovalan and Madhavi's daughter", ta: "கோவலன், மாதவியின் மகள்", text: ["The child Silappatikāram mentions is the heroine of Maṇimēkalai.", "சிலப்பதிகாரம் குறிப்பிடும் குழந்தையே மணிமேகலையின் தலைவி."], not_this: ["Kannagi being called her mother elsewhere doesn't make Kannagi her birth mother.", "கண்ணகியைத் தாய் என்பது பெற்றவள் என்று ஆகாது."], recs: [m04, m12, m13, x60]}
- {id: b_kannagi, cls: identity, en: "Kannagi herself", ta: "கண்ணகி", text: ["The same woman, whose image is set up in one epic and who speaks to Maṇimēkalai in the other.", "ஒரு காப்பியத்தில் படிமம் நிறுவப்படுபவளே மற்றதில் மணிமேகலையிடம் பேசுகிறாள்."], not_this: ["The stone, the image and the goddess remain three separate things.", "கல், படிமம், தெய்வம் மூன்றும் வேறானவை."], recs: [x73, m07, m08, r04]}
- {id: b_war, cls: continuation, en: "The northern war", ta: "வடநாட்டுப் போர்", text: ["Three cantos in one poem, a few lines retold in the other.", "ஒன்றில் மூன்று காதைகள், மற்றதில் சில வரிகள்."], not_this: ["Retelling isn't independent confirmation. It's one report told twice.", "மறுகூற்று தனிச் சான்று அல்ல."], recs: [x70, x71, x72]}
- {id: b_festival, cls: motif, en: "The drum of the Indra festival", ta: "இந்திர விழா முரசு", text: ["Both poems bring out the drum from Vachirakottam on an elephant's neck, in almost the same words.", "இரு நூல்களும் வச்சிரக் கோட்டத்து முரசை யானை மேல் ஏற்றுவதைக் கிட்டத்தட்ட ஒரே சொற்களில் கூறுகின்றன."], not_this: ["Same institution, separate years. In Maṇimēkalai's world a later festival is forgotten, and Puhar is lost.", "நிறுவனம் ஒன்று, விழாக்கள் வேறு."], recs: [n45, n46, n47, n73]}
- {id: b_food, cls: comparable, en: "A meal and a bowl", ta: "ஓர் உணவும் ஒரு பாத்திரமும்", text: ["Kannagi cooks one meal from what others gave her. Maṇimēkalai feeds a city from a bowl that a housewife filled first. Food reaches people through a chain of named hands in both.", "பிறர் தந்ததைக் கொண்டு கண்ணகி ஓர் உணவு சமைக்கிறாள். ஒரு மனைவி முதலில் இட்ட பாத்திரத்தால் மணிமேகலை ஊருக்கு உணவளிக்கிறாள்."], not_this: ["No food, vessel or recipe passes from one to the other.", "உணவோ பாத்திரமோ ஒன்றிலிருந்து மற்றதற்குச் செல்லவில்லை."], recs: [n02, n05, n07, c07, b02]}
- {id: b_wrong_eyes, cls: comparable, en: "Two deadly misidentifications", ta: "இரு கொடிய தவறான அடையாளங்கள்", text: ["A goldsmith says this anklet is the queen's. A husband sees a woman wearing his wife's form. In both, someone is killed for a wrong identification.", "இது அரசியின் சிலம்பு என்கிறான் பொற்கொல்லன். தன் மனைவி வடிவில் ஒருத்தியைக் காண்கிறான் கணவன். இரண்டிலும் தவறான அடையாளத்தால் கொலை."], not_this: ["One is a deliberate lie and the other an honest mistake, and the second man acts for himself. The anklets are not the same anklet, and Manimekalai isn't Kayasandikai.", "ஒன்று திட்டமிட்ட பொய், மற்றது உண்மையான மயக்கம். சிலம்புகள் ஒன்றல்ல; மணிமேகலை காயசண்டிகை அல்ல."], recs: [a08, a15, b07, b08, b13]}
- {id: b_craft, cls: comparable, en: "Magadha and Avanti at two buildings", ta: "இரு கட்டடங்களில் மகதமும் அவந்தியும்", text: ["Both kingdoms show up beside a grand Chola hall. In one poem their kings give the hall, made by Mayan. In the other their workers build it.", "இரு நாடுகளும் சோழர் மண்டபங்களோடு வருகின்றன. ஒன்றில் அவர்கள் அரசர் தருகின்றனர்; மற்றதில் அவர்கள் வினைஞர் கட்டுகின்றனர்."], not_this: ["The buildings are different, and shared place names don't show that any craft travelled.", "கட்டடங்கள் வேறு; பெயர் ஒற்றுமை கலை பரவியதைக் காட்டாது."], recs: [n31, n32, n33, n35, n37, n38]}
- {id: b_produce, cls: motif, en: "The same fruits in two lists", ta: "இரு பட்டியல்களில் அதே கனிகள்", text: ["Mango and plantain are in what Kannagi was given and in what the hill people brought the king. Jackfruit joins them only if கோளிப் பாகல் is read as jackfruit, and areca also turns up in both.", "கண்ணகிக்குக் கிடைத்தவற்றிலும் மலைமக்கள் அரசனுக்குத் தந்தவற்றிலும் மாவும் வாழையும் உள்ளன. கோளிப் பாகலைப் பலா என்று கொண்டால் பலாவும் சேரும்."], not_this: ["Both lists are in Silappatikāram, and no fruit moves between them. This one's here as a warning about what shared kinds can't prove.", "இரண்டும் சிலப்பதிகாரத்தில் உள்ளவை; எந்தக் கனியும் இடம் மாறவில்லை."], recs: [n02, n09, n50]}
- {id: b_colophon, cls: continuation, en: "The poem says so itself", ta: "நூலே கூறுகிறது", text: ["The last lines of Silappatikāram say its meaning is completed along with Maṇimēkalai, and in its blessing canto a maid tells the king that Madhavi and Maṇimēkalai have renounced.", "சிலப்பதிகாரத்தின் இறுதி வரிகள் உரைப்பொருள் மணிமேகலைமேல் முற்றியது என்கின்றன; மாதவி, மணிமேகலை துறவையும் கூறுகின்றன."], not_this: ["Those lines don't settle who wrote what, or when. The frame verses may be later than the poem.", "இவ்வரிகள் யார் எப்போது எழுதினார் என்பதைத் தீர்மானிக்கவில்லை."], recs: [v029, v068]}
- {id: b_father, cls: identity, en: "Kovalan's father", ta: "கோவலன் தந்தை", text: ["Silappatikāram says Masattuvan gave everything away when his son died. Maṇimēkalai finds him as a monk at Vanci, and he's the one who sends her to Kanchi.", "மகன் மாய்ந்ததால் மாசாத்துவான் துறந்ததைச் சிலப்பதிகாரம் கூறுகிறது. அவரையே மணிமேகலை வஞ்சியில் துறவியாகக் காண்கிறாள்."], not_this: ["The ancestor nine generations back is also called Kovalan, and he isn't our Kovalan.", "ஒன்பது தலைமுறைக்கு முந்தைய கோவலன் இவன் அல்லன்."], recs: [v067, v124, v125, v129]}
- {id: b_mayan, cls: identity, en: "Mayan, the maker no craftsman saw", ta: "மயன்", text: ["The divine architect is credited with the gifts at Puhar in one poem and the crystal room in the other. Only a character says the second, though: Cutamati.", "புகார்ப் பரிசுகளும் உவவனப் பளிக்கறையும் மயன் செய்தவை. இரண்டாவது சுதமதியின் சொல்."], not_this: ["Being told who made them isn't the same as a craft tradition. No human workshop is described.", "மனிதர் பட்டறை எதுவும் விவரிக்கப்படவில்லை."], recs: [n33, v077]}
- {id: b_thief, cls: comparable, en: "Two men called thief", ta: "கள்வன் எனப்பட்ட இருவர்", text: ["Madurai calls Kovalan a thief over an anklet. Brahmins call Aputhiran a thief over a cow he was saving. Both are shamed by a word, both end up connected to Madurai, and both words are false by what the poem tells us.", "சிலம்புக்காகக் கோவலன், ஆவைக் காத்ததற்காக ஆபுத்திரன், இருவரும் கள்வன் எனப்படுகின்றனர்."], not_this: ["The cases are unrelated, and the second man lives. The likeness is mine to point out: neither poem draws it.", "இரண்டும் தொடர்பற்றவை. இந்த ஒப்புமையை எந்த நூலும் கூறவில்லை."], recs: [a08, v059, v105, v106]}
