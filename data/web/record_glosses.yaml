# One plain sentence for every ledger record, in English and modern Tamil. The app answers from these.
# Written by hand from the cited lines, draft until a scholar reads them. Wording says who claims what.
a00: ["The anklets are Kannagi's own, in her words.", "சிலம்புகள் கண்ணகிக்கு உரியவை என்று அவளே கூறுகிறாள்."]
a01: ["Kannagi offers Kovalan her anklets: 'there are the anklets, take them'.", "'சிலம்புகள் உள்ளன, கொள்ளுங்கள்' என்று கண்ணகி கோவலனிடம் கூறுகிறாள்."]
a02: ["Kovalan plans to rebuild his lost wealth in Madurai, starting with the anklets. A plan, not yet done.", "சிலம்பை முதலாகக் கொண்டு மதுரையில் இழந்த பொருளை ஈட்டக் கோவலன் திட்டமிடுகிறான். இது திட்டம் மட்டுமே."]
a03: ["Kovalan takes one of the two anklets and sets out to sell it.", "இரண்டு சிலம்புகளில் ஒன்றை எடுத்துக்கொண்டு கோவலன் விற்கச் செல்கிறான்."]
a04: ["Kovalan unwraps the anklet and shows it to the goldsmith.", "கோவலன் சிலம்பின் பொதியை அவிழ்த்துப் பொற்கொல்லனிடம் காட்டுகிறான்."]
a05: ["The goldsmith says this anklet could only suit the queen. His words, not a fact.", "இந்தச் சிலம்பு அரசிக்கு மட்டுமே பொருந்தும் என்று பொற்கொல்லன் கூறுகிறான். இது அவன் கூற்று."]
a06: ["The goldsmith's own thought admits he secretly took the queen's anklet.", "அரசியின் சிலம்பைத் தான் ஒளித்து எடுத்ததைப் பொற்கொல்லன் தன் மனத்துள் ஒப்புக்கொள்கிறான்."]
a06b: ["The prologue says the goldsmith had taken the anklet himself, long before.", "அந்தச் சிலம்பை முன்பே பொற்கொல்லனே எடுத்திருந்தான் என்று பதிகம் கூறுகிறது."]
a07: ["The goldsmith plans to pin it on the newcomer before his own theft comes out.", "தன் திருட்டு வெளிப்படும் முன் புதியவன் மீது பழி போடப் பொற்கொல்லன் திட்டமிடுகிறான்."]
a08: ["The goldsmith tells the king that the thief who took the palace anklet is in his hut.", "அரண்மனைச் சிலம்பைத் திருடிய கள்வன் தன் குடிலில் இருப்பதாகப் பொற்கொல்லன் அரசனிடம் கூறுகிறான்."]
a09: ["Claim: Kovalan stole the queen's anklet. Only the goldsmith says so, and it is false.", "கூற்று: கோவலன் அரசியின் சிலம்பைத் திருடினான். இதைச் சொல்பவன் பொற்கொல்லன் மட்டுமே; இது பொய்."]
a10: ["The king accepts the accusation without examining it.", "ஆராயாமலே அரசன் அந்தக் குற்றச்சாட்டை ஏற்கிறான்."]
a11: ["The king calls the city guards and gives an order.", "அரசன் ஊர்க்காவலரை அழைத்து ஆணையிடுகிறான்."]
a12: ["The order has an 'if': if the anklet is in the thief's hand, kill him and bring it.", "ஆணையில் ஒரு நிபந்தனை உண்டு: சிலம்பு கள்வன் கையில் இருந்தால் அவனைக் கொன்று அதைக் கொண்டுவருக."]
a13: ["The guards look at Kovalan and say this is no man to be killed.", "இவன் கொல்லப்படத் தக்கவன் அல்லன் என்று காவலர் கூறுகின்றனர்."]
a14: ["The goldsmith talks the guards round with a long speech on how thieves work.", "திருடர்களின் தந்திரங்களை விவரித்துப் பொற்கொல்லன் காவலர்களை இணங்கச் செய்கிறான்."]
a15: ["One unlearned drunk man strikes Kovalan with a sword and kills him.", "கல்லாத களிமகன் ஒருவன் வாளால் வெட்டிக் கோவலனைக் கொல்கிறான்."]
k_karma_kov: ["The poet says Kovalan fell because his old karma rose up.", "பண்டை ஊழ்வினை உருத்ததால் கோவலன் வீழ்ந்தான் என்று புலவர் கூறுகிறார்."]
k_sceptre: ["The poet says the king's sceptre bent.", "அரசனின் செங்கோல் வளைந்தது என்று புலவர் கூறுகிறார்."]
a16: ["The king has the anklet brought and placed before him.", "அரசன் சிலம்பைக் கொண்டுவரச் செய்து தன் முன் வைக்கிறான்."]
a17: ["Kannagi reaches the palace gate holding one anklet in her hand.", "ஒற்றைச் சிலம்பைக் கையில் ஏந்திக் கண்ணகி அரண்மனை வாயிலை அடைகிறாள்."]
a18: ["Kannagi says her anklets are filled with gems.", "தன் சிலம்பில் மாணிக்கப் பரல்கள் உள்ளன என்று கண்ணகி கூறுகிறாள்."]
a19: ["The king says the queen's anklet is filled with pearls.", "அரசியின் சிலம்பில் முத்துகள் உள்ளன என்று அரசன் கூறுகிறான்."]
a20: ["Kannagi breaks an anklet. The text doesn't say which of the pair.", "கண்ணகி சிலம்பை உடைக்கிறாள். இரண்டில் எது என்று நூல் கூறவில்லை."]
a21: ["A gem flies out and strikes the king's mouth.", "மாணிக்கம் தெறித்து அரசனின் வாயில் படுகிறது."]
a22: ["The king sees the gem and knows the accusation was false.", "மாணிக்கத்தைக் கண்டு குற்றச்சாட்டு பொய் என்று அரசன் உணர்கிறான்."]
a23: ["'I am the thief', the king says in grief. A figure of speech, he stole nothing.", "'யானே கள்வன்' என்று அரசன் துயரத்தில் கூறுகிறான். இது உருவகம்; அவன் எதையும் திருடவில்லை."]
a24: ["The king falls and dies.", "அரசன் மயங்கி வீழ்ந்து உயிர் துறக்கிறான்."]
a25: ["Matari cries that Kovalan is innocent and the king was wrong, as reported by Matalan.", "கோவலன் குற்றமற்றவன், அரசன் பிழைத்தான் என்று மாதரி கூறியதை மாடலன் தெரிவிக்கிறான்."]
a26: ["Vetrivel Celiyan sacrifices a thousand goldsmiths to Kannagi, as Matalan reports.", "வெற்றிவேற் செழியன் ஆயிரம் பொற்கொல்லர்களைக் கண்ணகிக்குப் பலியிட்டதை மாடலன் தெரிவிக்கிறான்."]
a27: ["The queen's anklet was hers before the goldsmith took it.", "பொற்கொல்லன் எடுப்பதற்கு முன் அந்தச் சிலம்பு அரசியிடம் இருந்தது."]
b01: ["Kayasandikai tells how the sage Viruchikan's curse left her with unending hunger.", "விருச்சிகன் சாபத்தால் தீராப் பசி வந்ததைக் காயசண்டிகை கூறுகிறாள்."]
b02: ["Manimekalai feeds Kayasandikai from the bowl and her terrible hunger ends.", "மணிமேகலை பாத்திரத்திலிருந்து உணவிட, காயசண்டிகையின் பெரும்பசி நீங்குகிறது."]
b03: ["The real Kayasandikai was swallowed by the Vindhya demoness while flying home, says the pillar goddess.", "உண்மையான காயசண்டிகையை விந்தாகடிகை விழுங்கிவிட்டாள் என்று கந்திற்பாவை கூறுகிறது."]
b04: ["Manimekalai recognises Udayakumaran as Rahulan, her husband in an earlier birth.", "உதயகுமரனே முற்பிறப்பில் தன் கணவனாகிய இராகுலன் என்று மணிமேகலை உணர்கிறாள்."]
b05: ["Using a mantra, Manimekalai takes on Kayasandikai's form.", "மந்திரம் ஓதி மணிமேகலை காயசண்டிகையின் வடிவம் கொள்கிறாள்."]
b06: ["Disguised, Manimekalai tells the king she is a Vidyadhara woman. Not true.", "'நான் விஞ்சை மகள்' என்று மாறுவேடத்தில் மணிமேகலை அரசனிடம் கூறுகிறாள். இது உண்மையன்று."]
b07: ["Udayakumaran says the woman with the bowl is Manimekalai hiding by magic. He is right.", "பாத்திரம் ஏந்தியவள் மாயையால் மறைந்த மணிமேகலையே என்று உதயகுமரன் கூறுகிறான். அவன் கணிப்பு சரி."]
b08: ["Udayakumaran isn't fooled by the disguise.", "மாறுவேடம் உதயகுமரனை ஏமாற்றவில்லை."]
b09: ["Kanchanan takes the woman with the bowl for his wife Kayasandikai. He is wrong.", "பாத்திரம் ஏந்தியவளைத் தன் மனைவி காயசண்டிகை என்று காஞ்சனன் எண்ணுகிறான். அது தவறு."]
b10: ["Kanchanan believes she is his wife.", "அவள் தன் மனைவியே என்று காஞ்சனன் நம்புகிறான்."]
b11: ["Kanchanan decides the prince must be her lover. He is wrong again.", "இளவரசன் அவளுடைய காதலன் என்று காஞ்சனன் முடிவு செய்கிறான். இதுவும் தவறு."]
b12: ["Kanchanan burns with anger, believing the prince is her lover.", "இளவரசன் அவள் காதலன் என்று நம்பிக் காஞ்சனன் சினம் கொள்கிறான்."]
b13: ["Kanchanan cuts Udayakumaran down with his sword.", "காஞ்சனன் வாளால் உதயகுமரனை வெட்டிக் கொல்கிறான்."]
b14: ["The pillar goddess says karma took the prince's life.", "ஊழ்வினையே இளவரசனின் உயிரைக் கொண்டது என்று கந்திற்பாவை கூறுகிறது."]
b15: ["The pillar goddess tells Kanchanan the woman is Manimekalai in disguise.", "அவள் உருமாறிய மணிமேகலை என்று கந்திற்பாவை காஞ்சனனிடம் கூறுகிறது."]
b16: ["Told by the pillar goddess, Kanchanan can no longer hold his belief. His change of mind is an inference.", "கந்திற்பாவை சொன்ன பின் காஞ்சனனின் நம்பிக்கை நிலைக்க முடியாது. அவன் மனமாற்றம் நூலில் நேரடியாக இல்லை."]
b17: ["'Let this form perish', says Manimekalai, and she drops the disguise.", "'கெடுக இவ் உரு' என்று கூறி மணிமேகலை மாறுவேடத்தை நீக்குகிறாள்."]
b18: ["Manimekalai says she took the form to teach the prince and end his bad karma.", "இளவரசனின் தீவினையை நீக்க அறிவுரை கூறவே அந்த வடிவம் கொண்டதாக மணிமேகலை கூறுகிறாள்."]
c01: ["Chintadevi places the bowl in Aputhiran's hand.", "சிந்தாதேவி தன் கைப் பாத்திரத்தை ஆபுத்திரன் கையில் கொடுக்கிறாள்."]
c02: ["Aputhiran feeds the hungry with the bowl.", "ஆபுத்திரன் பாத்திரத்தால் பசித்தவர்களுக்கு உணவளிக்கிறான்."]
c03: ["Aputhiran is stranded alone on Manipallavam.", "ஆபுத்திரன் மணிபல்லவத்தில் தனியே விடப்படுகிறான்."]
c04: ["With no one left to feed, Aputhiran leaves the bowl in Gomukhi pond.", "உண்பவர் இல்லாததால் ஆபுத்திரன் பாத்திரத்தைக் கோமுகிப் பொய்கையில் விடுகிறான்."]
c05: ["Aputhiran tells the bowl: rise one day a year, and go to anyone who protects life with compassion.", "'ஆண்டுக்கு ஒரு நாள் தோன்று; அருளுடையோர் இருந்தால் அவர் கைக்குச் செல்' என்று ஆபுத்திரன் பாத்திரத்திடம் கூறுகிறான்."]
c06: ["The bowl's food never runs out, says Tivatilakai. Only the hands that serve grow tired.", "பாத்திரத்தின் உணவு குறையாது; வாங்கும் கைகளே வருந்தும் என்று தீவதிலகை கூறுகிறாள்."]
c07: ["The bowl rises from the pond and enters Manimekalai's hand. Nobody gives it to her here.", "பாத்திரம் பொய்கையிலிருந்து எழுந்து மணிமேகலையின் கையில் புகுகிறது. இங்கே கொடுப்பவர் எவரும் இல்லை."]
c08: ["The prologue tells it differently: Tivatilakai gave her the bowl.", "பதிகம் வேறுவிதமாகக் கூறுகிறது: தீபதிலகை பாத்திரத்தை அளித்தாள்."]
c09: ["Manimekalai tells the king a deity gave her the bowl. A third account.", "தெய்வம் தந்தது என்று மணிமேகலை அரசனிடம் கூறுகிறாள். இது மூன்றாவது கூற்று."]
c10: ["Sankatharuman puts a different bowl into Sutamati's hand. Same word, not Amudasurabhi.", "சங்கதருமன் வேறொரு பாத்திரத்தைச் சுதமதி கையில் தருகிறான். சொல் ஒன்று, ஆனால் இது அமுதசுரபி அன்று."]
d01: ["Madurapati says Kovalan was Bharatan in an earlier birth.", "முற்பிறப்பில் கோவலன் பரதன் என்று மதுராபதி கூறுகிறாள்."]
d02: ["In that birth, Bharatan calls the merchant Sangaman a spy and takes him to the king.", "அப்பிறப்பில் வணிகன் சங்கமனை ஒற்றன் என்று கூறிப் பரதன் அரசனிடம் கொண்டுசெல்கிறான்."]
d03: ["Claim: Sangaman is a spy. Only Bharatan says so.", "கூற்று: சங்கமன் ஒற்றன். இதைச் சொல்பவன் பரதன் மட்டுமே."]
d04: ["Sangaman is shown to the king and killed. The line doesn't name the killer.", "சங்கமன் அரசனிடம் காட்டப்பட்டுக் கொல்லப்படுகிறான். கொன்றவன் பெயர் இல்லை."]
d05: ["Neeli, Sangaman's wife, cries out for justice through the streets.", "சங்கமன் மனைவி நீலி தெருத்தோறும் நீதி கேட்டுப் புலம்புகிறாள்."]
d06: ["Neeli throws herself from a hill and lays a curse as she falls.", "நீலி மலையிலிருந்து வீழும்போது சாபம் இடுகிறாள்."]
d07: ["Her curse: may those who did this suffer as we have. A wish, not yet an event.", "'எமக்குத் துயர் செய்தோர் இதே துயர் உறுக' என்பது அவள் சாபம். இது விருப்பம், நிகழ்ச்சி அன்று."]
d08: ["There was already a saying that Madurai and its king would fall to fire on a set day.", "குறித்த நாளில் மதுரையும் அரசும் தீயால் அழியும் என்ற உரை முன்பே இருந்தது."]
d09: ["Kannagi ascends in a celestial car with Kovalan.", "கண்ணகி கோவலனுடன் வான ஊர்தியில் ஏறுகிறாள்."]
d10: ["Madurapati tells Kannagi that this curse is what has come upon them.", "அந்தச் சாபமே உங்களைப் பற்றியது என்று மதுராபதி கண்ணகியிடம் கூறுகிறாள்."]
e01: ["Kannagi twists off her left breast and hurls it at Madurai.", "கண்ணகி இடமுலையைத் திருகி மதுரை மீது எறிகிறாள்."]
e02: ["The fire god says he had long had orders for the day this wrong was done.", "இந்நகரை எரிக்க முன்பே தனக்கு ஏவல் உண்டு என்று அங்கி கூறுகிறான்."]
e03: ["Kannagi orders the fire to spare brahmins, the virtuous, cows, chaste women, the old and children.", "பார்ப்பார், அறவோர், பசு, பத்தினிப் பெண்டிர், மூத்தோர், குழந்தைகளை விட்டுவிடுமாறு கண்ணகி ஆணையிடுகிறாள்."]
e04: ["The fire consumes Madurai.", "தீ மதுரையை எரிக்கிறது."]
e05: ["Kannagi says she is blameless. Her own claim.", "'குற்றமிலேன் யான்' என்று கண்ணகி கூறுகிறாள். இது அவள் கூற்று."]
e06: ["The queen dies with the king, before the fire spreads.", "தீ பரவும் முன் அரசி அரசனுடன் உயிர் நீக்கிறாள்."]
e07: ["Matari walks into the fire in the dead of night, as Matalan reports.", "நள்ளிரவில் மாதரி தீயில் புகுந்ததை மாடலன் தெரிவிக்கிறான்."]
e08: ["Kavunti fasts until she dies, as Matalan reports.", "கவுந்தி உண்ணா நோன்பிருந்து உயிர் நீத்ததை மாடலன் தெரிவிக்கிறான்."]
f01: ["Manimekalai learns she was Lakshmi in an earlier birth.", "முற்பிறப்பில் தான் இலக்குமி என்று மணிமேகலை அறிகிறாள்."]
f02: ["In that birth Lakshmi married Rahulan.", "அப்பிறப்பில் இலக்குமி இராகுலனை மணந்தாள்."]
f03: ["The goddess Manimekala tells her that Udayakumaran is her Rahulan.", "உதயகுமரனே உன் இராகுலன் என்று மணிமேகலா தெய்வம் கூறுகிறது."]
f04: ["A sage foretells that Rahulan will die of a serpent's gaze within sixteen days.", "பதினாறு நாளில் திட்டிவிடத்தால் இராகுலன் இறப்பான் என்று முனிவர் முன்னுரைக்கிறார்."]
f05: ["In anger, Rahulan beheads a cook who stumbled, says the pillar goddess.", "தடுமாறிய மடையனைச் சினத்தில் இராகுலன் வாளால் வெட்டினான் என்று கந்திற்பாவை கூறுகிறது."]
f06: ["Rahulan dies of the serpent's gaze.", "இராகுலன் திட்டிவிடத்தால் இறக்கிறான்."]
f07: ["Lakshmi burns herself on his pyre.", "இலக்குமி அவன் ஈமத்தீயில் உயிர் விடுகிறாள்."]
f08: ["In other births Udayakumaran was her son, says the pillar goddess.", "வேறு பிறப்புகளில் உதயகுமரன் அவளுக்கு மகனாக இருந்தான் என்று கந்திற்பாவை கூறுகிறது."]
f09: ["And she was his daughter in others.", "வேறு பிறப்புகளில் அவள் அவனுக்கு மகளாகவும் இருந்தாள்."]
f10: ["That same deed, the pillar goddess says, is what came back to kill the prince.", "அதே வினையே மீண்டு வந்து இளவரசனைக் கொன்றது என்று கந்திற்பாவை கூறுகிறது."]
g01: ["Aputhiran fasts and gives up his life on Manipallavam.", "ஆபுத்திரன் மணிபல்லவத்தில் உண்ணா நோன்பிருந்து உயிர் நீக்கிறான்."]
g02: ["He is reborn to the king of Savakam. That this son is Punyarasan is an inference linking cantos 14 and 24.", "அவன் சாவக அரசனுக்கு மகனாகப் பிறக்கிறான். அவனே புண்ணியராசன் என்பது காதை 14, 24 இடையே செய்த அனுமான இணைப்பு."]
g03: ["Punyarasan is the son of Bhumichandran.", "புண்ணியராசன் பூமிசந்திரனின் மகன்."]
g04: ["Punyarasan rules Nagapuram.", "புண்ணியராசன் நாகபுரத்தை ஆள்கிறான்."]
h01: ["A guard reports that a strange woman fed the prisoners from a single bowl.", "ஒரு பெண் ஒற்றைப் பாத்திரத்தால் சிறையோருக்கு உணவளித்ததாகக் காவலன் தெரிவிக்கிறான்."]
h02: ["Asked what he can do, she tells the king to make the prison a house of charity.", "சிறைக்கோட்டத்தை அறக்கோட்டம் ஆக்குமாறு அவள் அரசனிடம் வேண்டுகிறாள்."]
h03: ["The king frees the prisoners and turns the prison into a house of charity.", "அரசன் சிறையோரை விடுவித்துச் சிறைக்கோட்டத்தை அறக்கோட்டம் ஆக்குகிறான்."]
l01: ["Madhavi gives her garland to a hunchbacked woman to offer in the street.", "மாதவி தன் மாலையைக் கூனியிடம் கொடுத்துத் தெருவில் விலைகூறச் செய்கிறாள்."]
l02: ["Kovalan buys the garland from her and goes home with Madhavi.", "கோவலன் அந்த மாலையை வாங்கி மாதவியின் மனைக்குச் செல்கிறான்."]
m01: ["Kannagi is Kovalan's wife.", "கண்ணகி கோவலனின் மனைவி."]
m02: ["Kovalan is the son of Masattuvan, says Kannagi.", "கோவலன் மாசாத்துவானின் மகன் என்று கண்ணகி கூறுகிறாள்."]
m03: ["Kannagi comes from the house of Manaikan.", "கண்ணகி மாநாய்கன் குலத்தைச் சேர்ந்தவள்."]
m04: ["Madhavi gave birth to a child, Manimekalai.", "மாதவி பெற்ற குழந்தை மணிமேகலை."]
m05: ["Manimekalai's father is Kovalan.", "மணிமேகலையின் தந்தை கோவலன்."]
m06: ["The poet calls Kannagi her mother. An address of respect, she did not bear her.", "கண்ணகியைத் 'தாய்' என்று புலவர் கூறுகிறார். இது மதிப்பு; பெற்றவள் அல்லள்."]
m07: ["Manimekalai worships the images of Kannagi and Kovalan at Vanci.", "வஞ்சியில் கண்ணகி, கோவலன் படிமங்களை மணிமேகலை வணங்குகிறாள்."]
m08: ["The goddess Kannagi answers her and speaks.", "பத்தினிக் கடவுளான கண்ணகி அவளுக்கு விடை கூறுகிறாள்."]
m09: ["Cenkuttuvan founds Kannagi's temple and orders daily festivals.", "செங்குட்டுவன் பத்தினிக் கோட்டம் அமைத்து நாள்விழா நடத்த ஆணையிடுகிறான்."]
m10: ["Gajabahu of Lanka and other kings ask Kannagi for a boon.", "இலங்கை வேந்தன் கயவாகுவும் பிற மன்னரும் கண்ணகியிடம் வரம் வேண்டுகின்றனர்."]
m11: ["'I have granted the boon', says a voice. The line doesn't name the speaker.", "'தந்தேன் வரம்' என்று ஒரு குரல் எழுகிறது. பேசியவர் பெயர் இங்கு இல்லை."]
r01: ["Retold in Manimekalai: Bharatan called Sangaman a spy before the king.", "மணிமேகலையில் மறுகூற்று: பரதன் சங்கமனை ஒற்றன் என்று அரசனிடம் கூறினான்."]
r02: ["Claim inside the retelling: Sangaman is a spy.", "மறுகூற்றின் உள்ளே உள்ள கூற்று: சங்கமன் ஒற்றன்."]
r03: ["The retelling adds that Sangaman was innocent, in those words: 'the blameless man'.", "'குற்றம் இலோனை' என்று மறுகூற்று சங்கமனைக் குற்றமற்றவன் என்று தெளிவாகக் கூறுகிறது."]
r04: ["Kannagi says herself, as a goddess: in my rage I destroyed the great city.", "'சீற்றம் கொண்டு செழுநகர் சிதைத்தேன்' என்று கண்ணகியே கூறுகிறாள்."]
r05: ["Kannagi foretells more births and deaths for Kovalan and herself, before they are freed.", "தானும் கோவலனும் இன்னும் பிறந்து இறந்து உழல்வோம் என்று கண்ணகி முன்னுரைக்கிறாள்."]
m12: ["Goddess Manimekala once rescued Kovalan's ancestor from a shipwreck.", "கோவலனின் முன்னோனைக் கப்பல் விபத்திலிருந்து மணிமேகலா தெய்வம் காத்தது."]
m13: ["Kovalan names his daughter after that family goddess.", "அந்தக் குலதெய்வத்தின் பெயரைக் கோவலன் தன் மகளுக்கு இடுகிறான்."]
x01: ["In her dream, Kovalan takes her by the hand to a great city.", "கனவில் கோவலன் அவள் கையைப் பிடித்து ஒரு பெரும் நகருக்கு அழைத்துச் செல்கிறான்."]
x02: ["In her dream, the townsfolk slander her.", "கனவில் ஊரார் அவள் மீது பழி சொல்கின்றனர்."]
x03: ["In her dream, harm comes to Kovalan.", "கனவில் கோவலனுக்குத் தீங்கு நேர்கிறது."]
x04: ["In her dream, she pleads before the king.", "கனவில் அவள் அரசன் முன் வழக்காடுகிறாள்."]
x05: ["In the queen's bad dream, the sceptre and parasol fall.", "அரசியின் தீக்கனவில் செங்கோலும் குடையும் வீழ்கின்றன."]
x06: ["Awake and for real, Kannagi pleads before the king: 'king who did not examine'.", "'தேரா மன்னா' என்று கண்ணகி நனவில் அரசன் முன் வழக்காடுகிறாள்."]
x10: ["Kavunti entrusts Kannagi to Matari until she reaches the house of rich folk.", "செல்வர் மனை புகும் வரை கண்ணகியைக் கவுந்தி மாதரியிடம் அடைக்கலமாகத் தருகிறாள்."]
x11: ["'I have lost my ward', cries Matari.", "'அடைக்கலம் இழந்தேன்' என்று மாதரி புலம்புகிறாள்."]
x20: ["Kovalan decides Madhavi sang with her mind on someone else. His reading only.", "மாதவி வேறொருவனை நினைந்து பாடினாள் என்று கோவலன் எண்ணுகிறான். இது அவன் கணிப்பு மட்டுமே."]
x21: ["Kovalan believes it.", "கோவலன் அதை நம்புகிறான்."]
x22: ["The poet says his old karma had risen up.", "அவன் ஊழ்வினை உருத்தது என்று புலவர் கூறுகிறார்."]
x23: ["Kovalan lets go of her and leaves the shore without her.", "கோவலன் அவளை விட்டுக் கானலிலிருந்து தனியே செல்கிறான்."]
x30: ["When Kannagi embraces the body, Kovalan rises.", "கண்ணகி உடலைத் தழுவ, கோவலன் எழுந்து நிற்கிறான்."]
x31: ["He wipes away her tears with his hand.", "அவன் தன் கையால் அவள் கண்ணீரைத் துடைக்கிறான்."]
x32: ["'Stay', he tells her, and goes.", "'இருந்தைக்க' என்று கூறி அவன் செல்கிறான்."]
x33: ["Kannagi wonders: is this illusion, or a god deceiving me? She only asks.", "'மாயங்கொல், மருட்டிய தெய்வங்கொல்' என்று கண்ணகி வியக்கிறாள். இது கேள்வி மட்டுமே."]
x40: ["The goddess Manimekala carries sleeping Manimekalai to Manipallavam.", "மணிமேகலா தெய்வம் மணிமேகலையை மணிபல்லவத்துக்குத் தூக்கிச் செல்கிறது."]
x41: ["The goddess tells Sutamati the same: I placed her on Manipallavam.", "'மணிபல்லவத்தில் வைத்தேன்' என்று தெய்வமே சுதமதியிடம் கூறுகிறது."]
x42: ["The goddess Manimekala herself takes the form of a local woman.", "மணிமேகலா தெய்வமும் ஊர்ப் பெண்ணின் வடிவம் கொள்கிறது."]
x50: ["'Take another form', Kannagi's words advise her, since nobody will teach a young girl.", "'வேற்று உருக் கொள்க' என்று அவளுக்கு அறிவுறுத்தப்படுகிறது; இளையவளுக்கு யாரும் விளக்க மாட்டார்கள்."]
x51: ["Using the mantra, Manimekalai takes the form of a male ascetic.", "மந்திரம் ஓதி மணிமேகலை ஒரு மாதவன் வடிவம் கொள்கிறாள்."]
x60: ["Madhavi calls Manimekalai the daughter of the great Pattini, Kannagi.", "மணிமேகலையை மாபெரும் பத்தினியின் மகள் என்று மாதவி கூறுகிறாள்."]
x61: ["Madhavi retells it: Kannagi set the king's great city on fire.", "கண்ணகி அரசனின் பேரூரை எரியூட்டியதை மாதவி மீண்டும் கூறுகிறாள்."]
x62: ["Aravana Adikal teaches Madhavi in her grief.", "துயரில் இருந்த மாதவிக்கு அறவண அடிகள் அறம் உரைக்கிறார்."]
x63: ["His teaching: to be born is to suffer. A doctrine, kept as a claim.", "'பிறந்தோர் உறுவது பெருகிய துன்பம்' என்பது அவர் உரை. இது கொள்கை."]
x70: ["Cenkuttuvan's poets advise that stone from the Himalaya would be fitting.", "இமயத்துக் கல் தகுதியானது என்று புலவர்கள் செங்குட்டுவனிடம் கூறுகின்றனர்."]
x71: ["Himalayan ascetics reported the northern kings' scornful words. Reported, at second hand.", "வட அரசர்களின் இகழ்ச்சிச் சொற்களை இமயத் தாபதர் தெரிவித்தனர். இது கேள்விச் செய்தி."]
x72: ["Cenkuttuvan beats the northern kings and sets the sacred stone on their crowned heads.", "செங்குட்டுவன் வட அரசர்களை வென்று அவர்கள் முடிமீது தெய்வக் கல்லை ஏற்றுகிறான்."]
x73: ["Cenkuttuvan installs the finished image of Kannagi. The image isn't Kannagi.", "செங்குட்டுவன் கண்ணகியின் படிமத்தை நிறுவுகிறான். படிமம் கண்ணகி அல்ல."]
x80: ["Manimekalai goes to the Vaidika teacher and asks for his doctrine.", "மணிமேகலை வைதிக அளவைவாதியிடம் சென்று அவன் கொள்கையைக் கேட்கிறாள்."]
x81: ["His claim: the truth of things is known through these means of knowledge.", "பொருளின் உண்மையை இந்த அளவைகளால் அறிய வேண்டும் என்பது அவன் கூற்று."]
x82: ["She will find no truth in those sects, it is foretold to her.", "அச்சமயங்களில் மெய்ம்மை இல்லை என்று அவளுக்கு விளங்கும் என்று முன்னுரைக்கப்படுகிறது."]
x90: ["Kannagi tells the hill folk she lost her husband there, who has done such harm as I.", "அங்கே கணவனை இழந்து வந்த கடுவினையேன் என்று கண்ணகி குன்றவரிடம் கூறுகிறாள்."]
x91: ["The hill folk tell how the gods took her away with her husband.", "வானவர் அவளைக் கணவனுடன் கொண்டு சென்றதைக் குன்றவர் கூறுகின்றனர்."]
x92: ["'Take her as your god', the hill folk call out to one another.", "'தெய்வம் கொள்ளுமின்' என்று குன்றவர் ஒருவரையொருவர் அழைக்கின்றனர்."]
s01: ["Madhavi takes the stage and dances.", "மாதவி அரங்கேறி ஆடுகிறாள்."]
s02: ["Kovalan lives with Madhavi, forgetting his home.", "தன் மனையை மறந்து கோவலன் மாதவியுடன் வாழ்கிறான்."]
s03: ["Kovalan leaves the cowherds' quarter.", "கோவலன் இடையர் இல்லத்தை விட்டுச் செல்கிறான்."]
s04: ["Kovalan sees the goldsmith in the street, with his hundred craftsmen.", "நூறு கொல்லர் பின்வர வரும் பொற்கொல்லனைக் கோவலன் காண்கிறான்."]
s05: ["Kovalan goes into a lodging beside a temple to wait.", "கோவலன் தேவகோட்டத்தின் அருகே சென்று காத்திருக்கிறான்."]
s06: ["Kannagi comes before the king.", "கண்ணகி அரசன் முன் வருகிறாள்."]
s07: ["The king falls in a faint.", "அரசன் மயங்கி வீழ்கிறான்."]
s08: ["Manimekalai goes into the flower grove to pick flowers.", "மலர் கொய்ய மணிமேகலை பூம்பொழிலுள் செல்கிறாள்."]
s09: ["She hides in the crystal room.", "அவள் பளிக்கறையுள் புகுகிறாள்."]
s10: ["Udayakumaran sees her there and goes away troubled.", "உதயகுமரன் அவளைக் கண்டு துயருடன் செல்கிறான்."]
s11: ["Manimekalai worships at the great seat.", "மணிமேகலை பெரும் பீடிகையைத் தொழுது வணங்குகிறாள்."]
s12: ["Manimekalai rises into the sky and travels to Vanci.", "மணிமேகலை வானில் எழுந்து வஞ்சிக்குச் செல்கிறாள்."]
s13: ["Manimekalai flies to a grove outside Nagapuram.", "மணிமேகலை பறந்து நாகபுரத்தின் புறத்துப் பொழிலில் இறங்குகிறாள்."]
s14: ["Manimekalai comes to from her faint.", "மயக்கம் தெளிந்து மணிமேகலை எழுகிறாள்."]
