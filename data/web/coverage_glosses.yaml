# English and modern Tamil for the coverage records. Hand-written from the cited lines. Draft until a scholar reads them.
v001: ["Kannagi and Kovalan live together in the upper storey of a tall house.", "கண்ணகியும் கோவலனும் நெடுநிலை மாடத்தில் சேர்ந்து வாழ்கின்றனர்."]
v002: ["Kovalan heaps praise on Kannagi: flawless gold, a right-spiral pearl, unblemished scent.", "குற்றமற்ற பொன்னே, வலம்புரி முத்தே என்று கோவலன் கண்ணகியைப் போற்றுகிறான்."]
v003: ["A great lady sets Kannagi up with her own household, to care for guests and give to the worthy.", "பெருமைக்குரிய ஒரு பெண் கண்ணகிக்குத் தனிக் குடும்பம் அமைத்துத் தருகிறாள்."]
v004: ["Madhavi dresses up and greets Kovalan with love on the moonlit terrace.", "நிலா முற்றத்தில் மாதவி கோலம் கொண்டு கோவலனை எதிர்கொள்கிறாள்."]
v005: ["The same evening Kannagi, alone, has left off her anklets and every ornament but the marriage one.", "அதே மாலை தனித்திருக்கும் கண்ணகி சிலம்பு முதலிய அணிகளை ஒழித்து மங்கல அணியை மட்டும் கொண்டிருக்கிறாள்."]
v006: ["Madhavi takes up the yāḻ and sings.", "மாதவி யாழை எடுத்துப் பாடுகிறாள்."]
v007: ["Madhavi writes to Kovalan on a white screw-pine leaf, with lac for ink and a jasmine bud for a pen.", "தாழை வெண்தோட்டில் செம்பஞ்சுக் குழம்பால், பித்திகை அரும்பை ஆணியாகக் கொண்டு மாதவி எழுதுகிறாள்."]
v008: ["She calls Vayantamalai and tells her to take it to Kovalan and bring him back.", "வசந்தமாலையை அழைத்து அதைக் கோவலனிடம் தந்து அவனை அழைத்து வரச் சொல்கிறாள்."]
v009: ["Vayantamalai hands the garland-letter to Kovalan in the grain market.", "கூலமறுகில் வசந்தமாலை அதைக் கோவலனிடம் தருகிறாள்."]
v010: ["Kovalan dismisses it: she's a dancer, these are just a dancer's arts. His words.", "'ஆடல் மகள் ஆதலால் இவையெல்லாம் அவளுக்கு இயல்பு' என்று கோவலன் தள்ளுகிறான். இது அவன் சொல்."]
v011: ["He refuses the letter.", "அவன் முடங்கலை மறுக்கிறான்."]
v012: ["Vayantamalai hurries back, grieving, and tells Madhavi.", "வசந்தமாலை வருந்தி விரைந்து சென்று மாதவியிடம் கூறுகிறாள்."]
v013: ["Madhavi says that if he won't come tonight she'll see him in the morning, and lies awake. A hope, and it never comes true.", "மாலை வராவிட்டாலும் காலையில் காண்போம் என்று மாதவி உறங்காமல் கிடக்கிறாள். இது எதிர்பார்ப்பு மட்டுமே."]
v014: ["Driven by old karma, Kovalan leaves Puhar with Kannagi before dawn.", "ஊழ்வினை உந்த, வைகறையில் கோவலன் கண்ணகியுடன் புகாரை விட்டு நீங்குகிறான்."]
v015: ["Tired already, Kannagi asks where old Madurai is. Kovalan smiles and says it's thirty kātam off, and near.", "களைத்த கண்ணகி மதுரை மூதூர் யாது என்று கேட்கிறாள்; முப்பது காதம், அருகில்தான் என்று கோவலன் நகைக்கிறான்."]
v016: ["They come to the Jain nun Kavunti and fall at her feet.", "அவர்கள் கவுந்தி அடிகளைக் கண்டு அடி தொழுகின்றனர்."]
v017: ["Kavunti says she wants to go to Madurai too and will walk with them.", "தானும் மதுரைக்கு வருவதாகக் கவுந்தி கூறுகிறாள்."]
v018: ["She warns Kovalan of what this road holds: pits, thorns, water and snakes. What may happen, not what does.", "வழியில் உள்ள ஏதங்களைக் கவுந்தி கூறுகிறாள். இவை நேரக்கூடியவை மட்டுமே."]
v019: ["They pass through the Chola country's farmland: paddy, sugarcane and the threshing songs.", "நெல்லும் கரும்பும் நிறைந்த சோழநாட்டு வயல்களைக் கடக்கின்றனர்."]
v020: ["A Jain charana appears and teaches, and they fall at his feet with Kavunti.", "சாரணர் தோன்றி அறம் உரைக்கிறார்; அவர்கள் கவுந்தியுடன் வணங்குகின்றனர்."]
v021: ["He teaches that strong karma ripens from the seed sown and can't be escaped. Doctrine, as he states it.", "வல்வினை விதைத்ததன் பயனாக வரும், ஒழிக்க முடியாது என்று அவர் கூறுகிறார். இது அவர் போதனை."]
v022: ["A wanton woman and an idle man jeer: are these a brother and sister, living together? Their taunt, not a fact.", "'உடன் பிறந்தவர் சேர்ந்து வாழ்வதும் உண்டோ?' என்று ஒரு பரத்தையும் வறுமொழியாளனும் ஏளனம் செய்கின்றனர்."]
v023: ["Kavunti curses the pair to be old jackals in the thorn scrub.", "கவுந்தி அவர்களை முதுநரி ஆகுக எனச் சபிக்கிறாள்."]
v024: ["The curse takes hold, and they hear the two howling as jackals.", "சாபம் பலிக்கிறது; குறுநரிகளின் ஊளை கேட்கிறது."]
v025: ["Kovalan and Kannagi, shaken, ask her to name when the pair will be freed.", "நடுங்கிய கோவலனும் கண்ணகியும் அவர்கள் உய்யும் காலத்தைக் கேட்கின்றனர்."]
v026: ["She limits it: twelve months beside Uraiyur's wall, and then their old forms back.", "உறையூர் மதில் அருகே பன்னிரு மாதம் துன்புற்ற பின் பழைய உருப் பெறுக என்கிறாள்."]
v027: ["The three reach the outer wall of Uraiyur.", "மூவரும் உறையூரின் புறஞ்சிறைக்கு வந்து சேர்கின்றனர்."]
v028: ["The closing statement praises the Chera line and Cenkuttuvan.", "கட்டுரை சேரர் குலத்தையும் செங்குட்டுவனையும் சிறப்பிக்கிறது."]
v029: ["The poem's last lines say the meaning is completed along with Maṇimēkalai.", "நூலின் இறுதி வரிகள் உரைப்பொருள் மணிமேகலைமேல் முற்றியது என்று கூறுகின்றன."]
v030: ["Kovalan asks an old brahmin where he's from and why he's here.", "கோவலன் முதிய மறையவனிடம் ஊரையும் வரவையும் கேட்கிறான்."]
v031: ["The brahmin, from Mangadu, sets out the roads to Madurai and their dangers.", "மாங்காட்டு மறையவன் மதுரைக்கான வழிகளை விவரிக்கிறான்."]
v032: ["He says Sirumalai carries rice, sugarcane, millet, garlic, turmeric, plantain, areca, coconut, mango and jackfruit. Here jackfruit is named outright, and this is a statement of where things grow.", "சிறுமலையில் நெல், கரும்பு, தினை, காயம், மஞ்சள், வாழை, கமுகு, தெங்கு, மா, பலா உள்ளன என்று அவன் கூறுகிறான்."]
v033: ["Kavunti tells him they have no need of the cave and its powers.", "பிலம் புக வேண்டியதில்லை என்று கவுந்தி அவனிடம் கூறுகிறாள்."]
v034: ["A forest deity, wanting Kovalan, appears at a pool in Vayantamalai's form.", "காட்டுத் தெய்வம் கோவலனை விரும்பி வசந்தமாலை வடிவில் தோன்றுகிறது."]
v035: ["In that form she says Madhavi grieved and renounced her because of his harsh refusal. A lie in a borrowed shape.", "அந்த வடிவில், மாதவி வருந்தித் தன்னைத் துறந்தாள் என்று பொய் கூறுகிறது."]
v036: ["Warned of such deities, Kovalan says a spell and she owns up: I'm the forest spirit, and I deceived you.", "எச்சரிக்கப்பட்ட கோவலன் மந்திரம் கூற, 'நான் வனசாரிணி' என்று அது ஒப்புக்கொள்கிறது."]
v037: ["He brings water on a lotus leaf and eases the tired Kannagi.", "தாமரை இலையில் நீர் கொண்டுவந்து கண்ணகியின் களைப்பை நீக்குகிறான்."]
v038: ["The three reach the temple of the goddess Aiyai.", "மூவரும் ஐயை கோட்டத்தை அடைகின்றனர்."]
v039: ["Salini, of the hunters' lineage, is seized by the goddess in front of them.", "மறக்குடிச் சாலினிக்குத் தெய்வம் ஏறுகிறது."]
v040: ["The hunters dress a girl as the goddess, with boar tusk for a crescent, tiger's teeth for a necklace and striped skin for a girdle.", "பன்றிக் கொம்பு, புலிப்பல் தாலி, புலித்தோல் ஆகியவற்றால் ஒரு குமரியைத் தெய்வமாக அலங்கரிக்கின்றனர்."]
v041: ["Possessed, Salini points at Kannagi: the goddess of Kongu, the queen of the western hills, the fruit of Tamil penance. Spoken under possession, and it comes before anything has happened to her.", "கண்ணகியைக் காட்டி இவளே கொங்கச் செல்வி என்று சாலினி கூறுகிறாள்."]
v042: ["Kannagi says the old woman is raving and smiles, hiding behind her husband.", "மூதறிவாட்டி பேதுற்றுக் கூறுகிறாள் என்று கண்ணகி கணவன் பின் ஒதுங்கி நகைக்கிறாள்."]
v043: ["The hunters promise the goddess blood from the throat, in song, as the price of victory.", "மிடற்றுக் குருதியை வெற்றிக்கு விலையாக எயினர் பாடலில் தருகின்றனர்."]
v044: ["Kovalan asks Kavunti to look after Kannagi while he goes to tell the city's merchants how he stands.", "நிலையை வணிகர்க்கு உணர்த்தி வருவதுவரை கண்ணகியைக் காக்குமாறு கோவலன் கவுந்தியை வேண்டுகிறான்."]
v045: ["Kavunti consoles him with two heroes who lost more: one who left home at his father's word, one who lost a kingdom at dice.", "தந்தை சொல்லால் காடு சென்றவன், சூதில் நாடிழந்தவன் எனக் கவுந்தி இருவரைக் காட்டி ஆறுதல் கூறுகிறாள்."]
v046: ["Kovalan walks past the sword-bearing Yavana guards at the fortress gate of Madurai.", "வாள் ஏந்திய யவனக் காவலரைக் கடந்து கோவலன் மதுரைக்குள் செல்கிறான்."]
v047: ["The women of Madurai wear pearls from the great harbour of Korkai. A rare line that names a source.", "மதுரைப் பெண்கள் கொற்கைத் துறை முத்துகளை அணிகின்றனர்."]
v048: ["Fleets from Tondi bring agarwood, silk, sandalwood, perfume and camphor to Madurai.", "தொண்டியோரின் கலங்கள் அகில், துகில், ஆரம், வாசம், கருப்பூரம் கொண்டுவருகின்றன."]
v049: ["The gem street sells flawless diamonds, emeralds, rubies, sapphires and coral, graded by people who know.", "மணி வீதியில் வயிரம், மரகதம், பதுமம், நீலம், பவளம் விற்கப்படுகின்றன."]
v050: ["The gold street deals in four named grades of gold.", "பொன் வீதியில் நால்வகைப் பொன் விற்கப்படுகிறது."]
v051: ["The cloth street stacks cloth of cotton, hair and silk.", "அறுவை வீதியில் நூல், மயிர், பட்டு ஆடைகள் அடுக்கப்பட்டுள்ளன."]
v052: ["The grain street heaps grain and sacks of black pepper, out of season too.", "கூல வீதியில் தானியமும் மிளகுப் பொதிகளும் குவிந்துள்ளன."]
v053: ["Having seen the king's city and been glad of it, Kovalan goes back outside the walls.", "காவலன் பேரூரைக் கண்டு மகிழ்ந்து கோவலன் மதிலுக்கு வெளியே திரும்புகிறான்."]
v054: ["Matari sees the omens: milk that won't set, tears from the bull's eyes, butter that won't melt, a lamb that won't play.", "குடத்துப் பால் உறையாமை, ஏற்றின் கண்ணீர், வெண்ணெய் உருகாமை, மறி ஆடாமை ஆகிய நிமித்தங்களை மாதரி காண்கிறாள்."]
v055: ["Telling her daughter not to fear, she calls a kuravai dance for Kannagi to watch, so that the cows' trouble may pass.", "அஞ்சாதே என்று மகளிடம் கூறி, கண்ணகி காணக் குரவை ஆடுவோம் என்கிறாள்."]
v056: ["They dance the kuravai, in the story of Krishna and Pinnai.", "கண்ணன், பின்னை கதையில் குரவை ஆடுகின்றனர்."]
v057: ["They ask the god they've sung to end the trouble among their cattle. A wish.", "ஆநிரைகளின் துயரைத் தீர்க்குமாறு தெய்வத்தை வேண்டுகின்றனர்."]
v058: ["A woman who went to bathe in the Vaiyai comes back fast, having heard an uproar in town.", "வையையில் நீராடச் சென்றவள் ஊர் அரவம் கேட்டு விரைந்து வருகிறாள்."]
v059: ["She tells Kannagi what's being said: he's the thief who took the palace anklet, and armed men have marked him to die. A rumour she's passing on.", "அரண்மனைச் சிலம்பைத் திருடிய கள்வன் என்று அவனைக் கொல்லக் குறித்தனர் என்று கூறுகிறாள். இது கேட்ட செய்தி."]
v060: ["Kannagi rises, falls, weeps with red eyes, and cries out, where are you?", "கண்ணகி எழுந்து விழுந்து, எங்கணா என்று அழுகிறாள்."]
v061: ["She calls on the blazing Sun itself: is my husband a thief?", "'காய்கதிர்ச் செல்வனே, என் கணவன் கள்வனோ?' என்று கேட்கிறாள்."]
v062: ["A voice answers: he is no thief. Told as happening: the first thing in the story to clear him.", "'கள்வனோ அல்லன்' என்று ஒரு குரல் விடை தருகிறது."]
v063: ["The same voice adds that fire will devour this city. A prediction here.", "'ஒள்ளெரி இவ்வூரை உண்ணும்' என்றும் அக்குரல் கூறுகிறது."]
v064: ["Tevanti, the guardian woman and Kannagi's maid go to Madurai to see her and meet Matari's family.", "தேவந்தி, காவற்பெண்டு, அடித்தோழி மூவரும் மதுரைக்குச் செல்கின்றனர்."]
v065: ["They climb to the hill temple and tell Cenkuttuvan what has happened.", "மலைக் கோயிலில் செங்குட்டுவனுக்கு நடந்ததைக் கூறுகின்றனர்."]
v066: ["Tevanti cries that both Kannagi's and Kovalan's mothers have died of it.", "கண்ணகி, கோவலன் தாயர் இருவரும் உயிர் நீத்ததைத் தேவந்தி கூறுகிறாள்."]
v067: ["The guardian woman tells that both fathers, Masattuvan and Manaikan, gave everything away and renounced.", "மாசாத்துவானும் மாநாய்கனும் துறந்ததைக் காவற்பெண்டு கூறுகிறாள்."]
v068: ["The maid tells that Madhavi and Maṇimēkalai renounced under the Bodhi tree. Silappatikāram itself tells us the other poem's turning point.", "மாதவி, மணிமேகலை துறவை அடித்தோழி கூறுகிறாள். மற்றக் காப்பியத்தின் திருப்பத்தைச் சிலப்பதிகாரமே கூறுகிறது."]
v069: ["The king sees a streak of light in the sky wearing anklet, girdle and bangles.", "சிலம்பும் மேகலையும் அணிந்த மின்னற்கொடி வானில் தோன்றுவதை அரசன் காண்கிறான்."]
v070: ["Kannagi speaks from it: the Pandya is blameless, a guest in Indra's palace, and I'm his daughter. Her words, and they turn around what she said in court.", "'தென்னவன் தீதிலன்; நான் அவன் மகள்' என்று கண்ணகி கூறுகிறாள். இது அவள் கூற்று."]
v071: ["The women of Vanci sing of her who beat the king with a red anklet.", "செஞ்சிலம்பால் வேந்தனை வென்றாளை வஞ்சி மகளிர் பாடுகின்றனர்."]
v072: ["In a pounding song, the women of Puhar, Madurai and Vanci each pound pearls: with sugarcane, coral or sandal pestles. Poetic boast, not a report of what anyone did.", "புகார், மதுரை, வஞ்சி மகளிர் முத்துக் குறுவதாக வள்ளைப் பாட்டு கூறுகிறது. இது கவிதை உரைப்பு."]
v073: ["Hearing what her parents suffered, Maṇimēkalai's tears fall on the garland she's making and spoil it.", "பெற்றோர் பட்ட துயர் கேட்டு மணிமேகலையின் கண்ணீர் மாலையை நனைக்கிறது."]
v074: ["Madhavi wipes her tears and tells her to fetch fresh flowers herself.", "மாதவி கண்ணீரைத் துடைத்து, புது மலர் நீயே கொணர் என்கிறாள்."]
v075: ["Cutamati says she's the daughter of a brahmin called Kausikan, from Campai. No relation to Kosikan the messenger in the other poem.", "சண்பையில் கௌசிகன் என்னும் மறையவன் மகள் என்று சுதமதி கூறுகிறாள். சிலப்பதிகாரத்துக் கோசிகன் வேறு."]
v076: ["She tells how a Vidyadhara, Marutavegan, carried her off and later left her.", "மாருதவேகன் என்னும் விஞ்சையன் தன்னைத் தூக்கிச் சென்று கைவிட்டதைக் கூறுகிறாள்."]
v077: ["She says the crystal pavilion in the grove was made long ago by Mayan. The same Mayan the poet credits for the gifts at Puhar.", "உவவனத்தின் பளிக்கறையை மயன் பண்டு இழைத்தான் என்கிறாள். புகார்ப் பரிசுகளைச் செய்தவனும் மயனே."]
v078: ["On the road a drunk begs a Jain monk to drink coconut toddy, swearing there's no killing in it.", "தெங்கின் தேறலில் கொலை இல்லை, உண்ணுங்கள் என்று களிமகன் சமணத் துறவியிடம் இரக்கிறான்."]
v079: ["The crowd says it's a cruel mother who'd make this girl an ascetic. Their opinion.", "இவளைத் துறவியாக்கிய தாய் கொடியவள் என்று மக்கள் கூறுகின்றனர்."]
v080: ["Cutamati takes her in, and Maṇimēkalai enters the Uvavanam to gather flowers.", "சுதமதியுடன் மணிமேகலை உவவனத்தில் மலர் கொய்யப் புகுகிறாள்."]
v081: ["Prince Udayakumaran rides down and masters an elephant gone wild in the streets.", "வீதியில் மதம் பிடித்த யானையை உதயகுமரன் அடக்குகிறான்."]
v082: ["A merchant's son tells him his hand slipped on the yāḻ at the thought of Maṇimēkalai going to the grove, wasted with grief.", "மலர்வனம் செல்லும் மணிமேகலையை எண்ணி யாழ் தவறியது என்று எட்டிகுமரன் கூறுகிறான்."]
v083: ["The prince says he'll bring her back on his chariot. An intention.", "அவளைத் தன் தேரில் ஏற்றி வருவேன் என்று கூறுகிறான். இது எண்ணம்."]
v084: ["Hearing the chariot, Cutamati pushes her into the crystal room and bolts it.", "தேர் ஒலி கேட்டுச் சுதமதி அவளைப் பளிக்கறையில் ஒளித்துத் தாழிடுகிறாள்."]
v085: ["Cutamati tells the prince what a body is: born of karma, ageing, a nest of disease. Doctrine, as she gives it.", "உடம்பின் நிலையாமையைச் சுதமதி இளவரசனுக்கு உரைக்கிறாள்."]
v086: ["Before she finishes, he sees Maṇimēkalai through the crystal, like a coral doll.", "அவள் கூறி முடிக்கும் முன், பளிங்கின் உள்ளே பவளப் பாவை போல மணிமேகலை தெரிகிறாள்."]
v087: ["The shore of Manipallavam has pearls, broken coral and fragrant wood rolled in by the waves. So விரை மரம் washes up here too, which makes Saduvan's goods less special.", "மணிபல்லவக் கரையில் முத்தும் பவளமும் அலைகள் உருட்டும் விரை மரமும் உள்ளன."]
v088: ["She wakes on the sand and can see no one she knows, no city she knows.", "மணலில் விழித்து, அறிந்த உறவோ ஊரோ காணாது தவிக்கிறாள்."]
v089: ["She weeps for her father, who was cut down by the sword.", "வாளால் வீழ்ந்த தந்தையை எண்ணி 'ஐயாவோ' என்று அழுகிறாள்."]
v090: ["Indra placed the great gem seat here.", "தேவர் கோன் அந்த மாமணிப் பீடிகையை இட்டான்."]
v091: ["Two Naga kings, each calling it his, went to war over a seat neither could lift.", "எடுக்க முடியாத அப்பீடிகைக்காக இரு நாக மன்னர் போரிட்டனர்."]
v092: ["She asks for Aravana Atikal, goes to the old man and bows three times.", "அறவண அடிகளைத் தேடிச் சென்று மூன்று முறை வணங்குகிறாள்."]
v093: ["He tells how Vira died drunk under a new elephant and Tara threw herself from a terrace on hearing it.", "வீரை யானை முன் மாய்ந்ததையும், தாரை மாடியில் இருந்து வீழ்ந்ததையும் கூறுகிறார்."]
v094: ["The goddess had said that those sisters came back as Madhavi and Cutamati. A rebirth, so they're not the same people in the ordinary sense.", "அச்சகோதரிகளே மாதவியும் சுதமதியும் ஆகப் பிறந்தனர் என்று தெய்வம் கூறியது."]
v095: ["He foretells that the great one will appear in sixteen hundred and sixteen years.", "ஈரெண்ணூற்று ஈரெட்டு ஆண்டில் பேரறிவாளன் தோன்றுவான் என்கிறார்."]
v096: ["He tells her the one duty fit for humans and gods alike: ending the sickness of hunger.", "மக்களுக்கும் தேவர்க்கும் ஒத்த அறம் பசிப்பிணி தீர்த்தல் என்கிறார்."]
v097: ["She lifts the bowl, to put out the fire of every creature's hunger.", "உயிர்களின் பசி தீர அவள் பாத்திரத்தை எடுக்கிறாள்."]
v098: ["Sali, a brahmin wife fleeing her disgrace, gives birth on the road and leaves the baby in a grove.", "இழிவுக்கு அஞ்சி வந்த பார்ப்பனி சாலி வழியில் பெற்ற குழந்தையைத் தோட்டத்தில் இட்டுச் செல்கிறாள்."]
v099: ["A cow comes, licks him clean, feeds him and guards him for seven days.", "ஓர் ஆ வந்து நாவால் நக்கிப் பால் ஊட்டி ஏழு நாள் காக்கிறது."]
v100: ["A passing brahmin, Ilambuti, takes him home: not the cow's son, my son.", "ஆ மகன் அல்லன் என் மகன் என்று இளம்பூதி அவனை எடுத்துச் செல்கிறான்."]
v101: ["Grown, he sees a garlanded cow waiting for sacrifice, and leads it away in the night.", "வேள்விக்கு நின்ற ஆவின் துயர் கண்டு இரவில் அதை ஓட்டிச் செல்கிறான்."]
v102: ["The brahmins catch him on the road and beat him with a goad.", "அந்தணர்கள் அவனை வழியில் பிடித்துக் கோலால் அடிக்கின்றனர்."]
v103: ["The cow gores the teacher who's beating him and runs off.", "அடித்த உவாத்தியை ஆ கொம்பால் குத்திவிட்டு ஓடுகிறது."]
v104: ["One brahmin says he knows the boy's birth, and tells of Sali to shame him. His telling, in their quarrel.", "இவன் பிறப்பை அறிவேன் என்று சாலியின் கதையைக் கூறி ஓர் அந்தணன் இழிவு செய்கிறான்."]
v105: ["They call him a cow-stealing thief through every village, and drop stones in his bowl. Their name for him. It's the same word Madurai had for Kovalan.", "'ஆ கவர் கள்வன்' என்று ஊரெங்கும் கூறிக் கடிஞையில் கல்லிடுகின்றனர். கோவலனுக்கு மதுரை இட்ட அதே சொல்."]
v106: ["He goes to southern Madurai, lives at the Chintadevi temple and feeds the blind, the deaf and the lame from what he begs.", "தென்மதுரை சென்று சிந்தாதேவி கோயிலில் தங்கி, ஊனமுற்றோருக்கு உணவளிக்கிறான்."]
v107: ["The cow that nursed him goes to Savakam, to the sage Manmukan.", "அவனை வளர்த்த ஆ சாவகத்தில் மண்முக முனிவரிடம் செல்கிறது."]
v108: ["Having given up his life at Manipallavam, he's born from that cow in Savakam.", "மணிபல்லவத்தில் உயிர் நீத்தவன் அதே ஆவின் வயிற்றில் சாவகத்தில் பிறக்கிறான்."]
v109: ["Maṇimēkalai takes up the bowl and goes into the main street dressed as a nun.", "பாத்திரத்துடன் பிக்குணிக் கோலத்தில் பெருந்தெருவுக்கு வருகிறாள்."]
v110: ["Boys and rakes crowd round: the one Udayakumaran wants, with a beggar's bowl, what a marvel. Town talk.", "'உதயகுமரன் விரும்பியவள் பிச்சைப் பாத்திரம் ஏந்துவது வியப்பு' என ஊரார் பேசுகின்றனர்."]
v111: ["Kayasandikai tells her the virtuous Atirai lives in this house, and that she should go in.", "'ஆதிரை மனை இது, நீ புகுக' என்று காயசண்டிகை கூறுகிறாள்."]
v112: ["The old counsellor Vasantavai goes to console the grieving queen.", "வாசந்தவை என்னும் மூதாட்டி அரசியை ஆறுதல் கூறச் செல்கிறாள்."]
v113: ["Alone, the queen hides her grief behind a false face and says she'll trick Maṇimēkalai. An intention.", "துயரை மறைத்து மணிமேகலையை வஞ்சிப்பேன் என்று அரசி எண்ணுகிறாள்."]
v114: ["She talks the king out of holding Maṇimēkalai in prison, and gets her into her own care.", "அரசனிடம் பேசிச் சிறையிலிருந்து மணிமேகலையைத் தன்னிடம் பெறுகிறாள்."]
v115: ["She gives her a maddening drug, and it does nothing, because Maṇimēkalai knows her past births.", "மயக்கு மருந்து ஊட்டுகிறாள்; மறுபிறப்பு உணர்ந்தவளுக்கு அது பலிக்கவில்லை."]
v116: ["She pays an unlettered young man in gold to mark her body and say she slept with him.", "காணம் கொடுத்து, ஓர் இளைஞனை அவளைக் களங்கப்படுத்திப் பொய் பரப்பச் சொல்கிறாள்."]
v117: ["Maṇimēkalai sees through it, says a spell and takes a man's form.", "வஞ்சம் உணர்ந்து மந்திரத்தால் ஆண் உருக் கொள்கிறாள்."]
v118: ["The queen locks her in to starve, claiming she's ill. The hunger-ending spell keeps her well.", "பொய் நோய் காட்டி அடைக்கிறாள்; ஊண் ஒழி மந்திரத்தால் அவள் வருந்தவில்லை."]
v119: ["The queen trembles and begs pardon: I wronged an ascetic out of grief for my son.", "என் மகன் துயரால் தவறு செய்தேன், பொறுக்க என்று அரசி தொழுகிறாள்."]
v120: ["Maṇimēkalai asks whether she's weeping for the body or the life, and teaches her.", "'உடற்கு அழுதனையோ, உயிர்க்கு அழுதனையோ?' என்று மணிமேகலை உரைக்கிறாள்."]
v121: ["The queen bows. Maṇimēkalai won't have it and bows back to her, the prince's mother.", "அரசி தொழ, அதைப் பொறாத மணிமேகலை தானும் எதிர் வணங்குகிறாள்."]
v122: ["In Vanci, streets of fish sellers, salt traders and women selling toddy.", "வஞ்சியில் மீன், உப்பு, கள் விற்போர் தெருக்கள்."]
v123: ["And streets of goldsmiths, carpenters and painters. These are Vanci's own: no link to the goldsmith of Madurai.", "பொற்கொல்லர், தச்சர், ஓவியர் தெருக்கள். இவர்கள் மதுரைப் பொற்கொல்லன் அல்லர்."]
v124: ["Maṇimēkalai finds Kovalan's father at a monastery, a monk now, and bows at his feet. Her grandfather, from the other poem.", "கோவலன் தந்தையைத் துறவியாகக் கண்டு மணிமேகலை வணங்குகிறாள்."]
v125: ["He says an ancestor nine generations back, also called Kovalan, gave away a fortune and built the stupa at Vanci. A different man with the same name.", "ஒன்பது தலைமுறைக்கு முன் இருந்த கோவலன் இங்கு சயித்தம் கட்டினான் என்கிறார். இவன் வேறு ஒருவன்."]
v126: ["Charanas told him the sea would take Puhar, so he stayed. A prediction when said, and it came true.", "காவிரிப்பட்டினம் கடல் கொளும் என்று சாரணர் கூறியதால் இங்கு இருந்தேன் என்கிறார்."]
v127: ["He's heard that Kovalan will finish paying for his deeds, take up the path, and be freed at Kapilai with his wife. A prophecy, and neither poem shows it.", "கோவலன் தவம் தாங்கிக் காதலியுடன் கபிலையில் வீடு பெறுவான் என்று அறிந்தோர் கூறியதைச் சொல்கிறார்."]
v128: ["The Kanchi country has fallen into famine: no rain, people dying.", "காஞ்சி நாட்டில் மழை இன்றிப் பஞ்சம், உயிர்கள் மடிகின்றன."]
v129: ["He tells her: go and be a rain cloud to that land.", "அந்த நாட்டுக்கு மழைபோலச் சென்று காப்பது உன் கடன் என்கிறார்."]
v130: ["She takes the bowl in hand and flies north through the sky.", "பாத்திரத்தை ஏந்தி வானத்தில் பறந்து செல்கிறாள்."]
v131: ["An attendant tells Kanchi's king that Kovalan's daughter has come. Not the attendant of Punyarasan's court, a different man.", "கோவலன் மடந்தை வந்தாள் என்று கஞ்சுகன் காஞ்சி மன்னனிடம் கூறுகிறான்."]
v132: ["She has a lotus seat laid out like the one at Manipallavam, with shrines for Tīvatilakai and Maṇimēkalā.", "மணிபல்லவப் பீடிகை போலப் பங்கயப் பீடிகை அமைக்கிறாள்."]
v133: ["She sets the bowl down and calls: let every living thing come. People of eighteen tongues and animals eat.", "'எல்லா உயிரும் வருக' என்று அமுதசுரபியை வைத்து அழைக்கிறாள்."]
v134: ["When Aravanan arrives with her mothers, she washes his feet, serves him, and drops her disguise.", "அறவணரும் தாயரும் வர, அடி கழுவி உணவளித்து, மாய உருவை விடுகிறாள்."]
v135: ["She goes for refuge to the Buddha, the Dhamma and the Sangha.", "புத்தம், தருமம், சங்கம் மூன்றையும் சரண் அடைகிறாள்."]
v136: ["Aravanan teaches the twelve links of dependent arising, from ignorance on. Doctrine, as he gives it.", "பேதைமை முதலான பன்னிரு நிதானங்களை அறவணர் உரைக்கிறார்."]
v137: ["She takes up austerity to end the round of births, and the poem stops there.", "பிறவி அறுக என்று நோற்கிறாள். நூல் இங்கு முடிகிறது."]
