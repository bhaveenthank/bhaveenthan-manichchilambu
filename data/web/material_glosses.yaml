# English and modern Tamil for the material records. Hand-written from the cited lines. Draft until a scholar reads them.
n01: ["Matari asks the cowherd women to bring vessels for cooking.", "சமையலுக்குரிய கலங்களைக் கொண்டுவருமாறு மாதரி இடைக்குல மடந்தையரிடம் கூறுகிறாள்."]
n02: ["The cowherd women give Kannagi vessels, kōḷi fruit, cucumber, pomegranate, mango, plantain, sāli rice and milk products.", "இடைக்குல மடந்தையர் கண்ணகிக்குக் கலங்கள், கோளிப் பாகல், வெள்ளரி, மாதுளை, மாங்கனி, வாழை, சாலி அரிசி, பாற்பயன் ஆகியவற்றைத் தருகின்றனர்."]
n03: ["Kannagi cuts the vegetables with a curved knife until her fingers redden.", "விரல்கள் சிவக்கக் கண்ணகி வளைந்த அரிவாளால் காய்களை நறுக்குகிறாள்."]
n04: ["Aiyai lights the fire for her.", "ஐயை அடுப்பில் தீ மூட்டுகிறாள்."]
n05: ["Kannagi cooks for Kovalan, with Aiyai beside her.", "ஐயையுடன் கண்ணகி கோவலனுக்காகச் சமைக்கிறாள்."]
n06: ["Kovalan sits on a palm-leaf mat, the work of a skilled woman the poem doesn't name.", "பெயர் கூறப்படாத கைவல்ல ஒரு பெண் பனையோலையால் செய்த தவிசில் கோவலன் அமர்கிறான்."]
n07: ["Kannagi serves him on a tender plantain leaf.", "இளம் வாழைக் குருத்தில் கண்ணகி அவனுக்கு உணவு படைக்கிறாள்."]
n08: ["Watching, Aiyai and her mother wonder if he is Krishna. A likeness in their minds, not a fact.", "இவன் கண்ணனோ என்று ஐயையும் அவள் தாயும் வியக்கின்றனர். இது ஒப்புமை மட்டுமே."]
n09: ["After the meal Kannagi offers him betel and areca nut.", "உணவுக்குப் பின் கண்ணகி வெற்றிலையும் பாக்கும் தருகிறாள்."]
n10: ["The goldsmith says he can make crowns and royal ornaments. A boast about his craft, and not about this anklet.", "வேந்தர் முடி முதலிய அணிகலன்களைச் செய்வேன் என்று பொற்கொல்லன் கூறுகிறான். இந்தச் சிலம்பைப் பற்றியது அல்ல."]
n11: ["The goldsmith looks over the anklet's workmanship. He examines it, and that's all this line says he does to it.", "பொற்கொல்லன் சிலம்பின் வேலைப்பாட்டை ஆராய்கிறான். அவன் செய்தது ஆராய்ந்தது மட்டுமே."]
n12: ["The anklet is described: gems and diamonds set in fine gold.", "சிலம்பு: மணியும் வயிரமும் பொன்னில் கட்டியது."]
n13: ["The goldsmith appears ahead of a hundred fine smiths, honoured under the king's name.", "நூறு நுண்வினைக் கொல்லர் பின்வர, அரசன் பெயரால் சிறப்புப் பெற்ற பொற்கொல்லன் வருகிறான்."]
n20: ["Madhavi puts on her leg ornaments, each named.", "மாதவி கால் அணிகளை அணிகிறாள்."]
n21: ["Madhavi wears a girdle of thirty-two strands of pearl.", "முப்பத்திரண்டு காழ் முத்து மேகலையை மாதவி அணிகிறாள்."]
n22: ["She wears a painted bangle of gems and diamonds, with gold and coral bangles. The phrase is the same one used for Kannagi's anklet.", "மணியும் வயிரமும் கட்டிய சித்திரச் சூடகம், பொன், பவள வளையல்கள் அணிகிறாள். இதே தொடர் கண்ணகியின் சிலம்புக்கும் வருகிறது."]
n23: ["She wears rings, one set with emerald and diamond.", "மரகதமும் வயிரமும் உள்ள மோதிரங்களை அணிகிறாள்."]
n24: ["She wears ear ornaments set with sapphire.", "இந்திர நீலம் பதித்த காதணிகளை அணிகிறாள்."]
n30: ["The king of Vajra gave the Chola conqueror a victory canopy.", "வச்சிர நாட்டுக் கோன் சோழனுக்குக் கொற்றப் பந்தர் தந்தான்."]
n31: ["The king of Magadha, beaten back, gave a debate hall.", "பகை ஒழிந்த மகத வேந்தன் பட்டிமண்டபம் தந்தான்."]
n32: ["The king of Avanti gladly gave a tall arched gate.", "அவந்தி வேந்தன் மகிழ்ந்து உயர்ந்த தோரண வாயில் தந்தான்."]
n33: ["These three are made of gold and gems, the poet says, yet fine craftsmen never saw their like, for Mayan made them.", "பொன்னும் மணியும் கொண்டவை; நுண்வினைக் கம்மியர் காணாதவை; மயன் விதித்தவை என்று புலவர் கூறுகிறார்."]
n35: ["Workers of Magadha, smiths of Maratha, metalworkers of Avanti, Yavana carpenters and Tamil workers built the pavilion together.", "மகத வினைஞர், மராட்டக் கம்மர், அவந்திக் கொல்லர், யவனத் தச்சர், தமிழ் வினைஞர் ஆகியோர் சேர்ந்து மண்டபம் அமைத்தனர்."]
n36: ["Its pillars are coral, capitals gem, strands pearl and roof gold.", "பவளத் தூண், மணிப் போதிகை, முத்துத் தாமம், பொன் கூரை."]
n37: ["These workers are from Magadha.", "இவ்வினைஞர் மகதத்தவர்."]
n38: ["These metalworkers are from Avanti.", "இக்கொல்லர் அவந்தியர்."]
n39: ["These smiths are from Maratha country.", "இக்கம்மர் மராட்டத்தவர்."]
n40: ["These carpenters are Yavanas.", "இத்தச்சர் யவனர்."]
n41: ["The king goes up into the gold pavilion.", "அரசன் பொன் மண்டபத்தில் ஏறுகிறான்."]
n45: ["The festival drum from Vachirakottam is set on an elephant's neck.", "வச்சிரக் கோட்டத்து முரசம் யானையின் பிடரியில் ஏற்றப்படுகிறது."]
n46: ["Maṇimēkalai opens the same way: the drum from Vachirakottam on an elephant's neck.", "மணிமேகலையும் இவ்வாறே தொடங்குகிறது: வச்சிரக் கோட்டத்து முரசம் யானையின் பிடரியில்."]
n47: ["A drummer 'born of an old lineage' beats it and blesses the city. His name and home aren't given.", "'முதுகுடிப் பிறந்தோன்' முரசறைந்து நகரை வாழ்த்துகிறான். பெயரும் ஊரும் இல்லை."]
n50: ["The hill people carry ivory, agarwood, yak-tail fans, jars of honey or liquor, sandalwood, vermilion, collyrium, orpiment, cardamom, pepper, coconut, mango, jackfruit, garlic, sugarcane, areca and plantain to Cenkuttuvan.", "மலைமக்கள் தந்தம், அகில், கவரி, மதுக் குடங்கள், சந்தனம், சிந்துரம், அஞ்சனம், அரிதாரம், ஏலம், கறி, தெங்கு, மாங்கனி, பலா, காயம், கரும்பு, கமுகு, வாழை ஆகியவற்றைச் செங்குட்டுவனிடம் கொண்டு வருகின்றனர்."]
n51: ["They also bring young wild animals: lion and tiger cubs, elephant calves, peacocks and more.", "சிங்க, புலிக் குட்டிகள், யானைக் கன்று, மயில் முதலியவற்றையும் கொண்டு வருகின்றனர்."]
n52: ["They tell the king a woman who lost a breast under their vēṅkai tree went to heaven with her man, and that they don't know whose daughter she is.", "வேங்கை மரத்தடியில் முலை இழந்த பெண் தன் கணவனோடு வானம் சென்றாள், அவள் யார் மகள் என்று அறியோம் என்று அரசனிடம் கூறுகின்றனர்."]
n60: ["Saduvan's ship breaks up. He clings to a broken mast and washes up where the Nagas live.", "சாதுவன் கலம் உடைகிறது. உடைந்த மரத்தைப் பற்றி நாகர் வாழும் மலைப் பக்கம் சேர்கிறான்."]
n61: ["The Nagas mean to eat him, but he knows their language and they back off.", "நாகர்கள் அவனை உண்ண எண்ணுகின்றனர். அவர்கள் மொழியை அறிந்தவன் என்பதால் விலகுகின்றனர்."]
n62: ["Their chief orders a young woman, toddy and meat for him.", "அவர்கள் தலைவன் அவனுக்கு இளம் பெண், கள், ஊன் தருமாறு கூறுகிறான்."]
n63: ["Saduvan refuses them.", "சாதுவன் மறுக்கிறான்."]
n64: ["The chief says they have eaten shipwrecked men over and over, and these are their belongings.", "கலம் கவிழ்ந்தவர்களை உண்டோம், இவை அவர்கள் பொருள்கள் என்று தலைவன் கூறுகிறான்."]
n65: ["He gives Saduvan fragrant wood, soft cloth and heaped treasure.", "விரை மரம், மென் துகில், விழு நிதிக் குவியல் ஆகியவற்றைச் சாதுவனுக்குத் தருகிறான்."]
n66: ["Saduvan boards the ship of a merchant, Chandradattan, and comes home.", "சந்திரதத்தன் என்னும் வாணிகன் கலத்தில் ஏறி ஊர் திரும்புகிறான்."]
n67: ["Back home he lives with Atirai and gives much away in charity.", "ஆதிரையுடன் வாழ்ந்து பல தானங்கள் செய்கிறான்."]
n70: ["Pilivalai hands her infant son to the blanket merchant, who takes him aboard.", "பீலிவளை தன் குழந்தையைக் கம்பளச் செட்டியிடம் தர, அவன் வணங்கிப் பெற்றுக் கப்பலில் ஏற்றுகிறான்."]
n71: ["That very night the ship is wrecked near the shore, and the child is lost.", "அன்றிரவே கரை அருகே கலம் உடைந்து குழந்தை காணாமல் போகிறது."]
n72: ["The survivors tell King Killi.", "தப்பியவர்கள் கிள்ளி மன்னனிடம் கூறுகின்றனர்."]
n73: ["Searching shore and sea for his son, the king lets the festival lapse.", "மகனைத் தேடும் அரசன் விழாவைக் கொண்டாட மறந்துவிடுகிறான்."]
n74: ["The goddess Maṇimēkalā, angered, curses: let the sea take the city.", "மணிமேகலா தெய்வம் 'நகரைக் கடல் கொள்க' எனச் சபிக்கிறாள்."]
n75: ["Aravanan tells the same story of the child and the merchant later on.", "அறவணரும் பின்னர் இதே கதையைக் கூறுகிறார்."]
n80: ["Kosikan can't recognise the wasted Kovalan at first.", "மெலிந்த கோவலனைக் கோசிகன் முதலில் அடையாளம் காணவில்லை."]
n81: ["Kosikan carries the letter Madhavi wrote and hands it to Kovalan.", "மாதவி எழுதிய முடங்கலைக் கோசிகன் கொண்டுவந்து கோவலனிடம் தருகிறான்."]
n82: ["Kovalan gives Kosikan a letter to carry to his parents.", "பெற்றோருக்கான முடங்கலைக் கோவலன் கோசிகனிடம் தருகிறான்."]
n83: ["Matalan reports to Cenkuttuvan what became of Kovalan's wife.", "கோவலன் மனைவிக்கு நேர்ந்ததை மாடலன் செங்குட்டுவனுக்குக் கூறுகிறான்."]
n84: ["An attendant, hands joined, explains to King Punyarasan who Maṇimēkalai is.", "கஞ்சுகன் தொழுது மணிமேகலை யார் என்று புண்ணியராசனுக்குக் கூறுகிறான்."]
n85: ["The whole town gossips that Dharmadattan and Visakai should marry. Slander, not fact.", "தருமதத்தனும் விசாகையும் பற்றி ஊர் முழுதும் பழி பேசுகிறது."]
n86: ["Visakai goes to the painted figure on the pillar and asks it to clear them.", "விசாகை கந்தில் எழுதிய பாவையிடம் சென்று பழியை நீக்க வேண்டுகிறாள்."]
n90: ["Master artisans finish the image and dress it fully in fine ornaments.", "வித்தகர் இயற்றிய படிமத்துக்கு நன்கலங்கள் பூட்டப்படுகின்றன."]
n68: ["Atirai gives the first food into the bowl and wishes hunger gone from the whole world.", "ஆதிரை பாத்திரத்தில் முதல் உணவை இட்டு, உலகெங்கும் பசிப்பிணி அறுக என வாழ்த்துகிறாள்."]
n69: ["Maṇimēkalai puts food from the bowl into Kayasandikai's hand, and her terrible hunger ends.", "மணிமேகலை பாத்திரத்தில் இருந்து உணவைக் காயசண்டிகை கையில் இட, அவள் பெரும்பசி நீங்குகிறது."]
